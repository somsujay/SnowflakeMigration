# Environment configuration for Snowflake deployments
# Used by scripts/deploy.sh, scripts/rollback.sh, and CI/CD pipeline
#
# Each environment is a separate database with identical schema names.
# Schemas: RAW, CLEAN, CONFORMED, GOVERNANCE, METADATA
#
# Promotion path: dev → stage → prod

dev:
  database: FINANCE_CORE_DEV
  raw_schema: RAW
  clean_schema: CLEAN
  conformed_schema: CONFORMED
  governance_schema: GOVERNANCE
  warehouse: COMPUTE_WH
  connection: MY_TRIAL_ACCOUNT

stage:
  database: FINANCE_CORE_STAGE
  raw_schema: RAW
  clean_schema: CLEAN
  conformed_schema: CONFORMED
  governance_schema: GOVERNANCE
  warehouse: COMPUTE_WH
  connection: MY_TRIAL_ACCOUNT

prod:
  database: FINANCE_CORE_PROD
  raw_schema: RAW
  clean_schema: CLEAN
  conformed_schema: CONFORMED
  governance_schema: GOVERNANCE
  warehouse: COMPUTE_WH
  connection: MY_TRIAL_ACCOUNT
