name: Branch Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  enforce-branch-flow:
    name: Enforce Branching Rules
    runs-on: ubuntu-latest
    steps:
      - name: Check branch targeting rules
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: ${HEAD} → ${BASE}"
          echo ""

          # Define allowed merge paths:
          #   feature or feature/* → develop
          #   develop              → release or release/*
          #   release or release/* → main
          #   hotfix or hotfix/*   → main

          ALLOWED=false

          # feature → develop
          if [[ "$BASE" == "develop" ]]; then
            if [[ "$HEAD" == "feature" || "$HEAD" == feature/* ]]; then
              ALLOWED=true
            fi
          fi

          # develop → release/*
          if [[ "$BASE" == "release" || "$BASE" == release/* ]]; then
            if [[ "$HEAD" == "develop" ]]; then
              ALLOWED=true
            fi
          fi

          # release/* → main
          if [[ "$BASE" == "main" ]]; then
            if [[ "$HEAD" == "release" || "$HEAD" == release/* || "$HEAD" == "hotfix" || "$HEAD" == hotfix/* ]]; then
              ALLOWED=true
            fi
          fi

          if [[ "$ALLOWED" != "true" ]]; then
            echo ""
            echo "::error::Branch '${HEAD}' is not allowed to merge into '${BASE}'."
            echo ""
            echo "Allowed merge paths:"
            echo "  feature or feature/* → develop"
            echo "  develop              → release or release/*"
            echo "  release or release/* → main"
            echo "  hotfix or hotfix/*   → main"
            exit 1
          fi

          echo "✓ Branch flow is valid: ${HEAD} → ${BASE}"
