# Environment configuration for Snowflake deployments
# Used by scripts/deploy.sh, scripts/rollback.sh, and CI/CD pipeline
#
# All environments share a single database (FINANCE_CORE_DEV)
# with environment-prefixed schemas: RAW_DEV, CLEAN_DEV, etc.
#
# Promotion path: dev → qa → preprod → prod

dev:
  database: FINANCE_CORE_DEV
  schema_suffix: _DEV
  warehouse: COMPUTE_WH
  connection: MY_TRIAL_ACCOUNT

qa:
  database: FINANCE_CORE_DEV
  schema_suffix: _QA
  warehouse: COMPUTE_WH
  connection: MY_TRIAL_ACCOUNT

preprod:
  database: FINANCE_CORE_DEV
  schema_suffix: _PREPROD
  warehouse: COMPUTE_WH
  connection: MY_TRIAL_ACCOUNT

prod:
  database: FINANCE_CORE_PROD
  schema_suffix: _PROD
  warehouse: COMPUTE_WH
  connection: MY_TRIAL_ACCOUNT
